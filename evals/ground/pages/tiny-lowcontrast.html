input[type=checkbox]{width:14px;height:14px}.s{margin-top:40px;padding:7px 14px;background:#232733;color:#8b93a7;border:1px solid #2f3544;border-radius:4px;font-size:13px}a{color:#4b5563;font-size:12px}</style>
<h2>Preferências de notificação</h2>
<label><input type="checkbox" id="n1"> Receber e-mails de novidades</label>
<label><input type="checkbox" id="n2" checked> Alertas de segurança</label>
<label><input type="checkbox" id="n3"> Resumo semanal por e-mail</label>
<label><input type="checkbox" id="n4"> Notificações no navegador</label>
<button class="s" id="apply">Aplicar</button> &nbsp; <a id="reset" href="#">restaurar padrões</a>
