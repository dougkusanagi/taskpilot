[project]
name = "copilot-road-runner"
version = "0.1.0"
description = "MVP ultraleve de Computer Use 100% local para Windows"
requires-python = ">=3.12"
dependencies = [
  "pywinauto>=0.6.8",
  "pyautogui>=0.9.54",
  "mss>=9.0.2",
  "Pillow>=10.4.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "keyboard>=0.13.5",
  "psutil>=6.0.0",
]

[project.optional-dependencies]
# Tray + janela Spotlight + ditado ao vivo (host). Sandbox/CLI nao precisam.
# Instalar: uv sync --extra ui
ui = [
  "pywebview>=5.0",
  "pystray>=0.19",
  "faster-whisper>=1.0",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
]

# OCR local com caixas (click_text) sem Tesseract: modelos ONNX embutidos, só CPU.
# Instalar: uv sync --extra ocr
ocr = [
  "rapidocr-onnxruntime>=1.3",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]  # imports tardios sao intencionais (pyautogui/pywinauto)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# prompts verbatim dos model cards (Vocaela) e TOOLS_SPEC: nao quebrar linhas
"vocaela.py" = ["E501"]
"planner.py" = ["E501"]
